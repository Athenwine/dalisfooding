<style>
:root{--bg:#161615;--ink:#E5E4DE;--paper:#F4F1EA;--sage:#9AA68C;--moss:#4A5642;--line:rgba(229,228,222,.14);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;margin:0}
.disp{font-family:'Archivo','Arial Black',system-ui,sans-serif;font-stretch:125%;font-weight:800;letter-spacing:-.01em;line-height:1.05}
.line{border-color:var(--line)}
.btn{background:var(--ink);color:var(--bg);border-radius:999px;padding:.7rem 1.2rem;font-weight:700;transition:.2s}
.btn:hover{background:var(--sage)}
.ghost{border:1px solid var(--line);border-radius:999px;padding:.5rem 1rem;transition:.2s}
.ghost:hover,.on{background:var(--ink);color:var(--bg)}
.drawer{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.hdr{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:rgba(22,22,21,.92);backdrop-filter:blur(10px)}
input,select{background:transparent;border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;width:100%;color:var(--ink)}
select option{background:#161615}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero>*{animation:rise .8s both}.hero>*:nth-child(2){animation-delay:.12s}.hero>*:nth-child(3){animation-delay:.24s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
</style>

function Jar({p,big}){

 const w=p.s.startsWith('500');
 const lines=p.n.length>16?(p.n.split(' ').length>2?[p.n.split(' ').slice(0,1).join(' '),p.n.split(' ').slice(1).join(' ')]:p.n.split(' ')):[p.n];
 return html`<svg viewBox="0 0 120 160" class="w-full h-full"><rect x="${w?24:28}" y="${w?14:24}" width="${w?72:64}" height="12" rx="3" fill="#9aa4ab"/><rect x="${w?20:24}" y="${w?26:36}" width="${w?80:72}" height="${w?122:112}" rx="12" fill="${p.c}"/><rect x="${w?20:24}" y="${w?26:36}" width="${w?80:72}" height="${w?122:112}" rx="12" fill="url(#g)" opacity=".25"/><defs><linearGradient id="g"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000"/></linearGradient></defs><rect x="34" y="${w?64:62}" width="52" height="58" fill="#f4f1ea"/><text x="60" y="${w?78:76}" font-size="7" font-weight="800" text-anchor="middle" fill="#161615">Dali’s.</text>${lines.map((l,i)=>html`<text key=${i} x="60" y="${(w?92:90)+i*9}" font-size="${l.length>11?6.5:8}" font-weight="700" text-anchor="middle" fill="#161615">${l.toUpperCase()}</text>`)}</svg>`;
}

function Card({p,pro,onAdd}){
 const price=pro?p.p*0.85:p.p;
 return html`<article class="group border line rounded-2xl overflow-hidden flex flex-col bg-[#1c1c1b]">
  <div class="aspect-[4/5] overflow-hidden relative"><img src=${IMG[ik(p)]} alt=${p.n+' '+p.s} loading="lazy" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"/><span class="absolute top-3 left-3 text-xs font-bold px-3 py-1 rounded-full" style=${{background:'rgba(22,22,21,.85)',color:'#E5E4DE'}}>${p.s}</span></div>
  <div class="p-4 flex flex-col gap-2 flex-1">
   <h3 class="disp text-base">${p.n}</h3>
   <p class="text-sm opacity-60">${p.s} · ${kind(p)}</p>
   <p class="text-sm opacity-80 flex-1">${p.d}</p>
   <div class="flex items-end justify-between pt-2">
    <div><div class="text-lg font-bold">${money(price)}</div>${pro?html`<div class="text-xs" style=${{color:'var(--sage)'}}>Minimum ${p.moq} ${unitWord(p)} · prix pro −15 %</div>`:html`<div class="text-xs opacity-50">TTC · prix indicatif</div>`}</div>
    <button class="btn text-sm" onClick=${()=>onAdd(p)} aria-label=${'Ajouter '+p.n+' '+p.s}>${pro?'Ajouter ×'+p.moq:'Ajouter'}</button>
   </div></div></article>`;
}

 {t:'Pâtes crémeuses au pesto',tag:'Express',time:'12 min',d:'Une sauce nappante en deux minutes, sans cuire le pesto.',items:['pe25'],pantry:['pâtes','crème ou fromage frais','parmesan','citron'],steps:['Cuisez les pâtes al dente et gardez une louche d’eau de cuisson.','Hors du feu, mélangez le pesto, deux cuillères de crème et un peu d’eau de cuisson.','Ajoutez les pâtes, remuez vivement, puis parmesan et zeste de citron.'],tip:'Un bocal de 250 ml suffit pour 4 à 5 portions de pâtes.'},
 {t:'Crostini olives & feta',tag:'Apéritif',time:'12 min',d:'Une base découpée en croûtons, tartinée de feta et d’olives écrasées.',items:['BASE','ol25'],pantry:['feta ou ricotta','huile d’olive','citron'],steps:['Coupez la base en petits triangles, huilez-les et passez-les 5 minutes au four à 200 °C.','Écrasez la feta avec un filet d’huile d’olive et un peu de zeste de citron.','Tartinez les croûtons, déposez une cuillère d’olives écrasées et servez tiède.'],tip:'Idéal pour finir les restes de base : ils se conservent croustillants plusieurs heures.'},
 {t:'Tarte flambée express',tag:'Gourmande',time:'15 min',d:'Une pizza d’inspiration alsacienne : crème d’oignon, fromage frais et dinde fumée.',items:['BASE','oi25'],pantry:['fromage blanc ou crème','dinde fumée','ciboulette','poivre'],steps:['Four à 230 °C. Mélangez la crème d’oignon avec deux cuillères de fromage blanc.','Étalez sur la base et ajoutez la dinde fumée en lanières.','Cuisez 6 à 7 minutes, puis poivre et ciboulette.'],tip:'Ajoutez quelques anneaux d’oignon cru pour un contraste frais.'}
];

function App(){
 const [pro,setPro]=useState(false);
 const [cart,setCart]=useState({});
 const [open,setOpen]=useState(false);
 const [filter,setFilter]=useState('all');
 const [pb,setPb]=useState({base:'ba29',sauce:'st25',top:['ol25']});
 const [f,setF]=useState({name:'',phone:'',tax:'',zone:'Bizerte',addr:'',date:'',slot:SLOTS[1]});
 const [sent,setSent]=useState(false);
 const [rb,setRb]=useState('ba29');
 const [sending,setSending]=useState(false);
 const [mailErr,setMailErr]=useState(false);
 const [last,setLast]=useState(null);
 const step=p=>pro?p.moq:1;
 const add=(p,n)=>{setCart(c=>({...c,[p.id]:(c[p.id]||0)+(n||step(p))}));setOpen(true)};
 const rm=id=>setCart(c=>{const o={...c};delete o[id];return o});
 const chg=(id,d)=>setCart(c=>{const q=(c[id]||0)+d;const o={...c};if(q<=0)delete o[id];else o[id]=q;return o});
 const lines=Object.entries(cart).map(([id,q])=>({p:byId(id),q}));
 const unit=p=>pro?p.p*0.85:p.p;
 const sub=lines.reduce((s,l)=>s+unit(l.p)*l.q,0);
 const count=lines.reduce((s,l)=>s+l.q,0);
 const zone=ZONES.find(z=>z[0]===f.zone);
 const free=pro?300:80;
 const fee=sub===0?0:(sub>=free?0:zone[1]);
 const total=sub+fee;
 const days=useMemo(()=>Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()+i+1);return {v:d.toISOString().slice(0,10),l:d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}}),[]);
 const date=f.date||days[0].v;
 const moqIssues=pro?lines.filter(l=>l.q<l.p.moq):[];
 const canSend=lines.length&&f.name&&f.phone&&f.addr&&(!pro||f.tax)&&!moqIssues.length;
 const buildTxt=()=>'Commande Dali’s ('+(pro?'Pro':'Particulier')+')\n'+lines.map(l=>l.q+' × '+l.p.n+' '+l.p.s).join('\n')+'\nSous-total: '+money(sub)+'\nLivraison: '+(fee===0?'Offerte':money(fee))+'\nTotal: '+money(total)+'\nZone: '+f.zone+'\nAdresse: '+f.addr+'\nDate: '+date+', '+f.slot+'\nNom: '+f.name+(pro?'\nMF: '+f.tax:'')+'\nTél: '+f.phone;
 const send=async()=>{
  setSending(true);setMailErr(false);
  try{
   const r=await fetch('https://formsubmit.co/ajax/'+encodeURIComponent(CONFIG.email),{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({_subject:'Nouvelle commande Dali’s – '+f.name+' – '+money(total),_template:'table',_captcha:'false',_honey:'',Nom:f.name,Telephone:f.phone,Adresse:f.addr+' ('+f.zone+')',Commande:buildTxt()})});
   const j=await r.json();
   if(!r.ok||String(j.success)==='false')throw new Error(j.message||('Erreur '+r.status));
   setLast({...cart});setCart({});setSent(true);
  }catch(e){console.error('Envoi échoué:',e);setMailErr(String(e.message||e))}
  setSending(false);
 };
 const reorder=()=>{if(last){setCart(last);setSent(false);setMailErr(false)}};
 const stages=STAGES.map((s,i)=>[i,s]).filter(([i])=>filter==='all'||filter===String(i));
 const b=byId(pb.base),s=byId(pb.sauce),tops=pb.top.map(byId);
 const toggleTop=id=>setPb(x=>({...x,top:x.top.includes(id)?x.top.filter(t=>t!==id):[...x.top,id]}));
 const addPairing=()=>{[b,s,...tops].forEach(p=>setCart(c=>({...c,[p.id]:(c[p.id]||0)+step(p)})));setOpen(true)};
 const addRecipe=r=>{r.items.forEach(id=>{const p=byId(id==='BASE'?rb:id);setCart(c=>({...c,[p.id]:(c[p.id]||0)+step(p)}))});setOpen(true)};
 const nameRecipe=()=>{
  if(s.id==='pe25'&&tops.length===0) return 'Pizza pesto, nue et verte';
  const t=tops.map(x=>x.id);
  if(s.id==='st25'&&t.includes('ol25')&&t.includes('po25')) return 'Pizza tomate, olives & poivrons';
  if(t.includes('oi25')) return s.id==='pe25'?'Pizza pesto & oignon confit':'Pizza tomate & oignon caramélisé';
  if(t.includes('ol25')) return s.id==='pe25'?'Pizza pesto & olives écrasées':'Pizza tomate & olives écrasées';
  if(t.includes('po25')) return s.id==='pe25'?'Pizza pesto & poivrons':'Pizza tomate & poivrons';
  return 'Pizza '+(s.id==='pe25'?'pesto':'tomate')+' nature';
 };
 const Tab=({v,l})=>html`<button class=${'ghost text-sm '+(filter===v?'on':'')} onClick=${()=>setFilter(v)}>${l}</button>`;
 const Opt=({on,onClick,children})=>html`<button onClick=${onClick} class=${'ghost text-sm text-left '+(on?'on':'')}>${children}</button>`;

 return html`<div>
 <header class="hdr border-b line"><div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
  <a href="#top" class="disp text-2xl flex items-center gap-2"><${Leaf} size=${20} color="#9AA68C"/>Dali’s.</a>
  <div role="group" aria-label="Mode" class="flex border line rounded-full p-1 text-sm">
   <button onClick=${()=>setPro(false)} class=${'px-3 py-1.5 rounded-full transition '+(!pro?'bg-[#E5E4DE] text-[#161615] font-bold':'')}>Particuliers</button>
   <button onClick=${()=>setPro(true)} class=${'px-3 py-1.5 rounded-full transition '+(pro?'bg-[#E5E4DE] text-[#161615] font-bold':'')}>Professionnels</button>
  </div>
  <button onClick=${()=>setOpen(true)} class="relative p-2" aria-label="Ouvrir le panier"><${ShoppingBag} size=${24}/>${count>0&&html`<span class="absolute -top-1 -right-1 text-[11px] font-bold rounded-full w-5 h-5 flex items-center justify-center" style=${{background:'var(--sage)',color:'#161615'}}>${count}</span>`}</button>
 </div></header>

 <section id="top" class="max-w-6xl mx-auto px-4 pt-16 pb-20 md:pt-28 md:pb-28 hero">
  <p class="text-sm opacity-60 mb-6">Dali’s Food Industries · Bizerte, Tunisie</p>
  <h1 class="disp text-5xl sm:text-7xl md:text-8xl max-w-4xl">Calm, pure, rooted.</h1>
  <div class="mt-8 flex flex-col md:flex-row md:items-end md:justify-between gap-6">
   <p class="disp text-xl md:text-3xl max-w-md" style=${{color:'var(--sage)'}}>Manger simple, vivre léger.</p>
   <div class="flex gap-3 flex-wrap"><a href="#catalogue" class="btn">Voir le catalogue</a><a href="#accords" class="ghost">Composer une pizza</a><a href="#recettes" class="ghost">Recettes du chef</a></div>
  </div>
  <p class="mt-10 max-w-xl opacity-70">${pro?'Sauces, condiments et bases de pizza pour restaurants, hôtels et épiceries. Prix pro, cartons au minimum de commande, livraison planifiée.':'Des bocaux en verre et des bases de pizza pré-cuites, faits avec peu d’ingrédients. Une pizza maison en 10 minutes.'}</p>
 </section>

 <section id="catalogue" class="max-w-6xl mx-auto px-4 pb-20">
  <div class="flex flex-wrap items-end justify-between gap-4 mb-8">
   <h2 class="disp text-3xl md:text-4xl">Catalogue</h2>
   <div class="flex gap-2"><${Tab} v="all" l="Tout"/><${Tab} v="0" l="Base"/><${Tab} v="1" l="Sauces"/><${Tab} v="2" l="Garnitures"/></div>
  </div>
  ${pro&&html`<div class="mb-6 border line rounded-2xl p-4 flex flex-wrap items-center gap-3 text-sm"><${Building} size=${18}/><span>Mode Pro : minimum 6 bocaux ou 4 packs de bases par référence. Une carte de commande se remplit avec votre matricule fiscal au panier.</span></div>`}
  ${stages.map(([i,s])=>html`<div key=${i} class="mb-12"><div class="flex flex-wrap items-baseline gap-x-4 gap-y-1 mb-5 border-b line pb-3"><span class="disp text-3xl" style=${{color:'var(--sage)'}}>${i+1}</span><h3 class="disp text-xl">${s[0]}</h3><p class="text-sm opacity-60">${s[1]}</p></div><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">${s[2].map(id=>html`<${Card} key=${id} p=${byId(id)} pro=${pro} onAdd=${add}/>`)}</div></div>`)}
  <p class="text-xs opacity-50 mt-4">Prix indicatifs à confirmer avant commande.</p>
 </section>

 <section id="histoire" class="border-y line" style=${{background:'#1c1c1b'}}><div class="max-w-6xl mx-auto px-4 py-20 grid md:grid-cols-2 gap-12">
  <div><h2 class="disp text-3xl md:text-5xl">L’art de la pâte et des racines</h2>
   <p class="mt-6 opacity-70 max-w-md">Nos bases sont façonnées à la main, puis pré-cuites. Vous finissez la cuisson chez vous : croûte dorée, cœur moelleux, sans effort.</p></div>
  <div class="grid gap-6">
   ${[[Droplets,'65 % d’hydratation','Une pâte souple et alvéolée, qui garde sa mie légère après cuisson.'],[Wind,'Fermentation artisanale','Un temps de repos long pour développer le goût et faciliter la digestion.'],[Leaf,'Emballage scellé','Chaque base est protégée dans un emballage plastique scellé pour arriver intacte et fraîche.']].map(([Ic,t,d])=>html`<div key=${t} class="flex gap-4 border-t line pt-6"><span style=${{color:'var(--sage)'}}><${Ic} size=${26}/></span><div><h3 class="font-bold">${t}</h3><p class="opacity-70 text-sm mt-1">${d}</p></div></div>`)}
  </div></div></section>

 <section id="accords" class="max-w-6xl mx-auto px-4 py-20">
  <h2 class="disp text-3xl md:text-4xl">Composez votre pizza</h2>
  <p class="opacity-70 mt-3 max-w-lg">Choisissez une base, une sauce et vos garnitures. On vous propose la recette et le panier se remplit en un geste.</p>
  <div class="grid md:grid-cols-3 gap-8 mt-10">
   <div><h3 class="font-bold mb-3">1. Base</h3><div class="grid gap-2">${REC.base.map(id=>html`<${Opt} key=${id} on=${pb.base===id} onClick=${()=>setPb(x=>({...x,base:id}))}>${byId(id).n} · ${byId(id).s}</${Opt}>`)}</div></div>
   <div><h3 class="font-bold mb-3">2. Sauce</h3><div class="grid gap-2">${REC.sauce.map(id=>html`<${Opt} key=${id} on=${pb.sauce===id} onClick=${()=>setPb(x=>({...x,sauce:id}))}>${byId(id).n}</${Opt}>`)}</div></div>
   <div><h3 class="font-bold mb-3">3. Garnitures</h3><div class="grid gap-2">${REC.top.map(id=>html`<${Opt} key=${id} on=${pb.top.includes(id)} onClick=${()=>toggleTop(id)}>${byId(id).n}</${Opt}>`)}</div></div>
  </div>
  <div class="mt-10 border line rounded-2xl p-6 md:p-8 grid md:grid-cols-[1fr_auto] gap-6 items-center">
   <div><h3 class="disp text-2xl">${nameRecipe()}</h3>
    <ol class="mt-4 grid gap-2 text-sm opacity-80 list-decimal list-inside">
     <li>Préchauffez le four à 230 °C et posez la base ${b.s} sur une plaque.</li>
     <li>Étalez un quart du bocal de ${s.n.toLowerCase()} ${s.id==='pe25'?'(ou ajoutez-le après cuisson pour garder son parfum)':''}.</li>
     <li>Répartissez la mozzarella en dés${tops.length?', puis '+tops.map(t=>t.n.toLowerCase()).join(', '):''}.</li>
     <li>Cuisez 6 à 8 minutes, finissez d’un filet d’huile d’olive et de basilic frais.</li>
    </ol>
    <p class="text-sm mt-4 flex items-center gap-2" style=${{color:'var(--sage)'}}><${Flame} size=${16}/>Astuce : séchez la mozzarella au papier absorbant pour une base croustillante.</p></div>
   <button class="btn" onClick=${addPairing}>Ajouter ces ${2+tops.length} produits</button>
  </div>
 </section>


 <section id="recettes" class="border-t line" style=${{background:'#1c1c1b'}}><div class="max-w-6xl mx-auto px-4 py-20">
  <h2 class="disp text-3xl md:text-4xl">Les recettes du chef</h2>
  <p class="opacity-70 mt-3 max-w-xl">Huit idées pour tirer le meilleur de nos sauces et de nos bases : de la pizza classique à la chakchouka, en passant par les pâtes et l’apéritif. Un clic ajoute les produits au panier.</p>
  <div class="flex flex-wrap gap-2 mt-6 items-center text-sm"><span class="opacity-60">Format des bases :</span>${['ba23','ba29'].map(id=>html`<${Opt} key=${id} on=${rb===id} onClick=${()=>setRb(id)}>${byId(id).s}</${Opt}>`)}</div>
  <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4 mt-8">
   ${RECIPES.map(r=>{const its=r.items.map(id=>byId(id==='BASE'?rb:id));return html`<article key=${r.t} class="border line rounded-2xl p-5 flex flex-col gap-3 bg-[#161615]">
    <div class="flex items-center justify-between text-xs"><span class="font-bold" style=${{color:'var(--sage)'}}>${r.tag}</span><span class="opacity-60 flex items-center gap-1"><${Clock} size=${12}/>${r.time}</span></div>
    <h3 class="disp text-lg">${r.t}</h3>
    <p class="text-sm opacity-70">${r.d}</p>
    <div class="text-xs"><span class="opacity-50">Chez Dali’s : </span>${its.map(lab).join(' · ')}</div>
    <div class="text-xs"><span class="opacity-50">À avoir chez vous : </span>${r.pantry.join(', ')}</div>
    <details class="text-sm"><summary class="cursor-pointer font-bold">Voir les étapes</summary><ol class="mt-3 grid gap-2 list-decimal list-inside opacity-80">${r.steps.map((x,i)=>html`<li key=${i}>${x}</li>`)}</ol><p class="mt-3 flex gap-2 items-start" style=${{color:'var(--sage)'}}><${Flame} size=${16}/>${r.tip}</p></details>
    <button class="btn text-sm mt-auto" onClick=${()=>addRecipe(r)}>Ajouter ${its.length>1?'ces '+its.length+' produits':'ce produit'}</button></article>`})}
  </div>
 </div></section>

 <footer class="border-t line"><div class="max-w-6xl mx-auto px-4 py-10 flex flex-wrap justify-between gap-4 text-sm opacity-70">
  <span class="disp text-lg opacity-100">Dali’s.</span><a href="https://wa.me/21625226152" target="_blank" rel="noopener">Une question ? WhatsApp : +216 25 226 152</a><span>Produit par FOODING · Bizerte</span></div></footer>

 <div class=${'fixed inset-0 z-40 transition '+(open?'bg-black/60':'pointer-events-none bg-transparent')} onClick=${()=>setOpen(false)}></div>
 <aside class=${'drawer fixed top-0 right-0 bottom-0 z-50 w-full max-w-md flex flex-col '+(open?'translate-x-0':'translate-x-full')} style=${{background:'#1c1c1b',paddingTop:'env(safe-area-inset-top,0px)',paddingBottom:'env(safe-area-inset-bottom,0px)'}} aria-hidden=${!open}>
  <div class="flex items-center justify-between p-5 border-b line"><h2 class="disp text-xl">Panier ${pro?'Pro':''}</h2><button onClick=${()=>setOpen(false)} aria-label="Fermer"><${X} size=${22}/></button></div>
  <div class="flex-1 overflow-y-auto p-5 grid gap-5 content-start">
   ${sent&&html`<div class="border line rounded-xl p-4 text-sm flex gap-3" style=${{color:'var(--sage)'}}><${Check} size=${18}/>Commande envoyée ! Nous vous contactons rapidement pour confirmer la livraison.</div>`}
   ${lines.length===0&&html`<div class="text-center py-10 opacity-70"><p>Votre panier est vide.</p>${last?html`<button class="btn mt-4 inline-flex gap-2 items-center" onClick=${reorder}><${Repeat} size=${16}/>Recommander la dernière commande</button>`:html`<a href="#catalogue" class="ghost inline-block mt-4" onClick=${()=>setOpen(false)}>Parcourir le catalogue</a>`}</div>`}
   ${lines.map(({p,q})=>html`<div key=${p.id} class="flex gap-3 items-center">
    <img src=${IMG[ik(p)]} alt="" class="w-16 h-16 rounded-lg shrink-0 object-cover"/>
    <div class="flex-1 min-w-0"><div class="font-bold text-sm">${p.n}</div><div class="text-xs opacity-60">${p.s} · ${money(unit(p))}</div>${pro&&q<p.moq&&html`<div class="text-xs text-amber-400">Minimum ${p.moq} ${unitWord(p)}</div>`}</div>
    <div class="flex items-center gap-2 border line rounded-full"><button type="button" class="w-9 h-9 text-xl leading-none flex items-center justify-center" onClick=${()=>chg(p.id,-1)} aria-label="Retirer une unité">−</button><span class="text-sm w-8 text-center">${q}</span><button type="button" class="w-9 h-9 text-xl leading-none flex items-center justify-center" onClick=${()=>chg(p.id,1)} aria-label="Ajouter une unité">+</button></div><button type="button" class="w-9 h-9 flex items-center justify-center opacity-60 hover:opacity-100 hover:text-red-400 transition" onClick=${()=>rm(p.id)} aria-label=${'Supprimer '+p.n+' '+p.s} title="Supprimer">✕</button></div>`)}
   ${lines.length>1&&html`<button class="text-xs opacity-60 underline text-left justify-self-start" onClick=${()=>setCart({})}>Vider le panier</button>`}
   ${lines.length>0&&html`<div class="border-t line pt-5 grid gap-3">
    <h3 class="font-bold flex items-center gap-2"><${Truck} size=${18}/>Livraison</h3>
    <select value=${f.zone} onChange=${e=>setF({...f,zone:e.target.value})} aria-label="Zone">${ZONES.map(z=>html`<option key=${z[0]} value=${z[0]}>${z[0]} · ${money(z[1])}</option>`)}</select>
    <div class="grid grid-cols-2 gap-2"><select value=${date} onChange=${e=>setF({...f,date:e.target.value})} aria-label="Date">${days.map(d=>html`<option key=${d.v} value=${d.v}>${d.l}</option>`)}</select>
    <select value=${f.slot} onChange=${e=>setF({...f,slot:e.target.value})} aria-label="Créneau">${SLOTS.map(s=>html`<option key=${s}>${s}</option>`)}</select></div>
    <input placeholder="Nom ${pro?'ou raison sociale':''}" value=${f.name} onInput=${e=>setF({...f,name:e.target.value})}/>
    <input placeholder="Téléphone" inputmode="tel" value=${f.phone} onInput=${e=>setF({...f,phone:e.target.value})}/>
    <input placeholder="Adresse ou lieu de livraison" value=${f.addr} onInput=${e=>setF({...f,addr:e.target.value})}/>
    ${pro&&html`<input placeholder="Matricule fiscal" value=${f.tax} onInput=${e=>setF({...f,tax:e.target.value})}/>`}
   </div>`}
  </div>
  ${lines.length>0&&html`<div class="p-5 border-t line grid gap-3">
   <div class="flex justify-between text-sm opacity-80"><span>Sous-total</span><span>${money(sub)}</span></div>
   <div class="flex justify-between text-sm opacity-80"><span>Livraison ${fee===0?'(offerte dès '+money(free)+')':''}</span><span>${fee===0?'Offerte':money(fee)}</span></div>
   <div class="flex justify-between text-lg font-bold"><span>Total</span><span>${money(total)}</span></div>
   <button class=${'btn flex items-center justify-center gap-2 '+(canSend&&!sending?'':'opacity-40 pointer-events-none')} onClick=${send}><${Send} size=${16}/>${sending?'Envoi en cours…':'Envoyer la commande'}</button>
   ${mailErr&&html`<div class="text-xs text-amber-400 grid gap-2"><p>L’envoi a échoué. Réessayez, ou envoyez-nous la commande directement sur WhatsApp.</p><p class="opacity-70">Détail : ${mailErr}</p><a class="ghost text-center" target="_blank" rel="noopener" href=${'https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent(buildTxt())}>Envoyer sur WhatsApp</a></div>`}
   ${!canSend&&html`<p class="text-xs opacity-60 flex gap-2 items-center"><${Clock} size=${14}/>${moqIssues.length?'Complétez les minimums de commande.':'Renseignez nom, téléphone, adresse'+(pro?' et matricule fiscal.':'.')}</p>`}
  </div>`}
 </aside>
 </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
