<style>
:root{--bg:#161615;--ink:#E5E4DE;--paper:#F4F1EA;--sage:#9AA68C;--moss:#4A5642;--line:rgba(229,228,222,.14);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;margin:0}
.disp{font-family:'Archivo','Arial Black',system-ui,sans-serif;font-stretch:125%;font-weight:800;letter-spacing:-.01em;line-height:1.05}
.line{border-color:var(--line)}
.btn{background:var(--ink);color:var(--bg);border-radius:999px;padding:.7rem 1.2rem;font-weight:700;transition:.2s}
.btn:hover{background:var(--sage)}
.ghost{border:1px solid var(--line);border-radius:999px;padding:.5rem 1rem;transition:.2s}
.ghost:hover,.on{background:var(--ink);color:var(--bg)}
.drawer{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.hdr{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:rgba(22,22,21,.92);backdrop-filter:blur(10px)}
input,select{background:transparent;border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;width:100%;color:var(--ink)}
select option{background:#161615}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero>*{animation:rise .8s both}.hero>*:nth-child(2){animation-delay:.12s}.hero>*:nth-child(3){animation-delay:.24s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
</style>
